<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilah: The All-in-One Life Concierge for Older Adults</title>
<meta name="description" content="Lilah is the all-in-one life concierge for older adults, leveraging agentic infrastructure and physical systems to lift the caregiving burden off 63 million Americans.">
<meta property="og:title" content="Lilah: The All-in-One Life Concierge for Older Adults">
<meta property="og:description" content="Leveraging agentic infrastructure and physical systems to lift the caregiving burden off 63 million Americans.">
<meta property="og:url" content="https://joinlilah.com">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0E492A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E492A'/%3E%3Cpath d='M18 14h9v27h17v9H18z' fill='%23F6F7F3'/%3E%3Ccircle cx='44' cy='18' r='7' fill='%2385CD75'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0E492A;color:#FBFAF6;font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;gap:64px;
    padding:clamp(32px,6vw,88px) clamp(24px,6.2vw,88px);
    background-color:#0E492A;
    background-image:radial-gradient(circle,rgba(133,205,117,.28) 1.5px,transparent 2px);
    background-size:32px 32px}
  .orb{position:relative;width:104px;height:104px;flex:0 0 auto}
  .orb span{position:absolute;border-radius:50%}
  .orb .ring{inset:0;border:2px solid rgba(133,205,117,.45)}
  .orb .pulse{inset:0;border:2px solid #85CD75;animation:ring 3.6s ease-out infinite}
  .orb .dot{left:25px;top:25px;width:54px;height:54px;background:#85CD75;animation:orb 3.6s ease-in-out infinite}
  .copy{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
  h1{font-family:Outfit,system-ui,sans-serif;font-weight:600;font-size:clamp(88px,13vw,176px);line-height:.95;letter-spacing:-2px;animation:rise .7s ease-out both}
  .tag{font-family:Outfit,system-ui,sans-serif;font-weight:600;font-size:clamp(28px,3.9vw,52px);line-height:1.15;letter-spacing:-.5px;animation:rise .7s ease-out .25s both}
  .sub{max-width:760px;font-size:clamp(20px,2vw,28px);line-height:1.4;color:#D3E9CB;animation:rise .7s ease-out .5s both}
  @keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
  @keyframes ring{from{transform:scale(.6);opacity:.7}to{transform:scale(1.5);opacity:0}}
  @keyframes orb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"><span class="pulse"></span><span class="ring"></span><span class="dot"></span></div>
  <div class="copy">
    <h1>Lilah</h1>
    <p class="tag">The All-in-One Life Concierge for Older Adults</p>
    <p class="sub">Leveraging agentic infrastructure and physical systems to lift the caregiving burden off 63 million Americans.</p>
  </div>
</main>
</body>
</html>
